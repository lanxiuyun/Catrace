<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catrace 最新更新说明</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20252d;
      --muted: #727a86;
      --line: #d7dce2;
      --accent: #7757d8;
      --paper: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font: 14px/1.55 "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
    main { padding: 0; }
    .timeline { position: relative; display: grid; gap: 1rem; margin: 0; padding: 0 0 0 .75rem; list-style: none; }
    .timeline::before { content: ""; position: absolute; top: .45rem; bottom: .45rem; left: 1.17rem; width: 2px; background: var(--line); }
    .item { position: relative; min-height: 3.5rem; padding: 0 0 0 1.5rem; }
    .item::before { content: ""; position: absolute; top: .2rem; left: 0; width: .9rem; height: .9rem; border: 2px solid var(--paper); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .time { margin: 0; color: var(--muted); font: 600 .9rem/1.55 "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; letter-spacing: 0; }
    .text { margin: 0; font-size: .9rem; line-height: 1.55; }
    .details { display: grid; gap: .45rem; margin: .45rem 0 0; padding-left: 1rem; color: var(--muted); font-size: .82rem; line-height: 1.5; }
    @media (max-width: 22rem) { .text { font-size: .84rem; } .details { font-size: .78rem; } }
  </style>
</head>
<body>
  <main>
    <ol class="timeline" aria-label="本次更新说明">
      <li class="item">
        <div class="time">2026.10.15 - 发布 Catrace 26.10.15，提醒卡片首次弹出即可显示在最前。</div>
        <ul class="details">
          <li>修复重启后第一次出现的提醒小窗被其它置顶窗口遮挡的问题，不必再手动点击恢复。</li>
          <li>提醒小窗只在首次显示时调整一次层级，后续提醒不反复推高窗口，减少对全屏游戏的影响。</li>
          <li>更新提醒现在可直接查看官网最新版本说明，并以简洁时间线呈现更新内容。</li>
          <li>优化更新详情的自适应高度、超长内容滚动，以及按钮和更新源选择控件的交互反馈。</li>
        </ul>
      </li>
    </ol>
  </main>
  <script>
    (() => {
      const sendHeight = () => {
        const height = Math.ceil(document.documentElement.scrollHeight);
        window.parent.postMessage({ type: 'catrace-release-notes-height', height }, '*');
      };
      new ResizeObserver(sendHeight).observe(document.documentElement);
      window.addEventListener('load', sendHeight);
      sendHeight();
    })();
  </script>
</body>
</html>
